name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs, but never cancel a run that may deploy main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, spelling, build, and links
    runs-on: ubuntu-latest
    env:
      LYCHEE_VERSION: 0.24.2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Spelling
        run: npm run spell

      - name: Type check and build
        run: npm run build

      - name: Install lychee
        run: |
          file=lychee-x86_64-unknown-linux-gnu.tar.gz
          base="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$file"
          curl -fsSLO "$base/$file.sha256"
          sha256sum --check "$file.sha256"
          tar -xzf "$file"
          echo "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Links
        run: npm run links

      - name: Upload site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
